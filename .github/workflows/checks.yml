name: Checks

# Runs the test suite on every push and pull request.
#
# Until this existed, NOTHING ran automatically: the three other workflows
# release, watch the forks, and propose Ghostty bumps, but none of them ran a
# single test. The suite was only ever run by hand, which meant a bug could be
# committed, pushed, built, installed and hit by a person before anything
# noticed. One shipped that way — a stray single quote in the local launch
# script that made zsh fail to parse the line, so every local project terminal
# on the Mac died. The tests would have caught it. Nothing asked them to.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Newer pushes supersede older ones on the same ref; a queued run for a commit
  # nobody is waiting on is just latency for the one they are.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks that need no Xcode build. They finish in about a minute and
  # fail loudly, so an obvious mistake does not wait behind a 15-minute build.
  invariants:
    name: Invariants
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # These entitlements are what let the app sync. They have been silently
      # wrong before: the Mac shipped 1.0 with no aps-environment at all, so
      # CloudKit could never push to it and sync was poll-only. That one was
      # stripped at SIGNING time (see the release workflow, which now checks the
      # signed artifact) — this check catches the other half, someone deleting
      # or renaming the declaration in the source file.
      - name: Entitlements declare iCloud and push
        run: |
          set -euo pipefail
          fail=0
          check() { # file, key, human name
            if /usr/libexec/PlistBuddy -c "Print :$2" "$1" >/dev/null 2>&1; then
              echo "  ok    $1 → $3"
            else
              echo "  MISS  $1 → $3"; fail=1
            fi
          }
          echo "ShioMac:"
          check ShioMac/ShioMac.entitlements "aps-environment" "push"
          check ShioMac/ShioMac.entitlements "com.apple.developer.icloud-container-identifiers" "iCloud container"
          check ShioMac/ShioMac.entitlements "com.apple.developer.icloud-services" "CloudKit"
          echo "Shio (iOS):"
          check Shio/Shio.entitlements "aps-environment" "push"
          check Shio/Shio.entitlements "com.apple.developer.icloud-container-identifiers" "iCloud container"
          check Shio/Shio.entitlements "com.apple.developer.icloud-services" "CloudKit"
          exit $fail

      # The static libs are ~800 MB of build artifact and are deliberately not
      # in git. Committing one would bloat every clone forever, and git does not
      # forget.
      - name: No build artifacts committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(a|xcframework/.*\.a)$'; then
            echo "::error::a static library is tracked in git; those are build artifacts"
            exit 1
          fi
          echo "  ok    no .a files tracked"

      - name: Shell scripts are sane
        run: |
          set -euo pipefail
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          # Informational on style, failing on real errors only: these scripts
          # are long-lived and heavily commented, and a style nit should not
          # block a merge.
          shellcheck --severity=error scripts/*.sh

      - name: The project still generates
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          test -d Shio.xcodeproj || { echo "::error::xcodegen produced no project"; exit 1; }

  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          # Only for readable logs. Assuming the runner image ships it would
          # turn a missing formatter into "the tests failed".
          command -v xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # The GhosttyKit static libs are a pinned Release artifact, not git
      # content. Cache them on the pin so the 800 MB download happens once per
      # bump rather than once per run.
      - name: Read the GhosttyKit pin
        id: pin
        run: |
          tag="$(grep -m1 '^GHOSTTYKIT_TAG=' scripts/refresh-ghostty.sh | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned at $tag"

      - name: Cache GhosttyKit
        id: ghosttykit
        uses: actions/cache@v4
        with:
          path: Frameworks/GhosttyKit.xcframework
          key: ghosttykit-${{ steps.pin.outputs.tag }}

      - name: Fetch GhosttyKit
        if: steps.ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/refresh-ghostty.sh --fetch

      # The Mac target references ShioMac/Resources/tmux, which is gitignored
      # build output: Shio bundles a fallback tmux so it works on a Mac that
      # never installed one. A fresh clone does not have it and the build fails
      # on the missing reference, so CI has to produce it exactly as the
      # release lane does.
      - name: Bundle the fallback tmux
        run: |
          set -euo pipefail
          brew list tmux >/dev/null 2>&1 || brew install tmux
          ./scripts/bundle-tmux.sh

      - name: Generate the project
        run: xcodegen generate

      # The Mac suite is the big one and hosts the shared ShioKit tests.
      #
      # Signing: the runner has no Apple certificate and no provisioning
      # profile, so automatic signing fails outright. Ad-hoc (`-`) with the
      # entitlements dropped is what CI wants — but note it must still be
      # SIGNED, not merely unsigned: these runners are Apple Silicon, where an
      # unsigned arm64 binary cannot execute at all, so the test host would be
      # killed on launch. Dropping entitlements costs nothing here, because the
      # container falls back CloudKit → local store → in-memory.
      - name: Test ShioMac
        run: |
          set -o pipefail
          xcodebuild test \
            -project Shio.xcodeproj \
            -scheme ShioMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/ci \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | xcbeautify --renderer github-actions || {
              echo "::error::ShioMac tests failed"; exit 1;
            }

      # Resolved rather than hardcoded: pinning a device name breaks the day the
      # runner image drops it, and that failure reads as "our tests broke".
      # Newest iOS runtime, first iPhone in it. Sorting matters: the JSON is
      # keyed by runtime identifier and that order is not version order, so
      # "the first iPhone we see" can belong to an older runtime than the one
      # the scheme deploys against.
      #
      # A concrete simulator rather than `generic/platform=iOS Simulator`,
      # because generic builds every simulator arch including x86_64 and
      # GhosttyKit's simulator slice is arm64 only, so the link fails with
      # "symbol(s) not found for architecture x86_64".
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pick-sim.py" <<'PYEOF'
          import json, subprocess, sys
          out = subprocess.run(["xcrun", "simctl", "list", "devices", "available", "-j"],
                               capture_output=True, text=True, check=True).stdout
          devices = json.loads(out)["devices"]
          ios = {rt: vs for rt, vs in devices.items() if "iOS" in rt}
          def version(rt):
              tail = rt.rsplit(".", 1)[-1]          # ...SimRuntime.iOS-26-5 -> iOS-26-5
              return [int(p) for p in tail.split("-")[1:] if p.isdigit()]
          for rt in sorted(ios, key=version, reverse=True):
              for d in ios[rt]:
                  if "iPhone" in d["name"]:
                      print(f"{d['udid']}\t{d['name']}\t{rt}")
                      sys.exit(0)
          sys.exit("no iPhone simulator is available on this runner")
          PYEOF
          line="$(python3 "$RUNNER_TEMP/pick-sim.py")"
          echo "chose $(echo "$line" | cut -f2) on $(echo "$line" | cut -f3)"
          echo "id=$(echo "$line" | cut -f1)" >> "$GITHUB_OUTPUT"

      # BUILD, not test.
      #
      # The iOS app compiles and links fine for the simulator, but the test HOST
      # crashes on launch before the harness connects ("Early unexpected exit").
      # That is pre-existing, not something this workflow introduced, and is
      # tracked separately. Compiling is still worth doing on every push and is
      # not a token gesture: `build-for-testing` below is exactly what caught
      # ShioAppTests still referencing the `Skill` model, deleted when Skills
      # was shelved. That target had not compiled for weeks and nothing said a
      # word, because nothing ever built it.
      - name: Build Shio (iOS)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Shio.xcodeproj \
            -scheme Shio \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || {
              echo "::error::the iOS app or its test target does not compile"; exit 1;
            }
